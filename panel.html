<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>题见 PageWise</title><link rel="stylesheet" href="panel.css"></head>
<body><header><span class="badge">CHROME · 学习助手</span><h1>题见 PageWise</h1><p>网页里的题目，直接读取、一起解析。</p></header>
<main><details id="settings"><summary>模型设置</summary><label>接口地址（完整 Chat Completions 地址）<input id="endpoint" type="url" placeholder="https://你的服务/v1/chat/completions"></label><label>模型名称<input id="model" placeholder="填写服务支持的模型名称"></label><label>API Key<input id="key" type="password" autocomplete="off" placeholder="仅保存在本机 Chrome"></label><button id="save">保存并授权接口</button><p class="hint">支持兼容 Chat Completions 的接口；图片识别需模型支持视觉。密钥保存在本机，未加密，不会同步。</p></details>
<section><h2>1 · 读取题目</h2><p id="site" class="hint">正在检查当前网站…</p><button id="grant" disabled>授权当前网站读取</button><div class="row"><button id="read" class="primary">读取当前页文字</button><button id="capture">识别可见页面</button></div><p class="hint">文字优先读取你选中的内容，否则读取页面正文。图片模式只截取当前可见区域，请先滚动到题目位置。</p><textarea id="question" placeholder="读取后可删掉无关内容，也可以直接粘贴题目和选项。"></textarea><div id="preview" hidden><img id="shot" alt="待发送的页面截图"><button id="remove">移除截图</button></div></section>
<section><h2>2 · 生成解析</h2><label>参考资料（可选）<textarea id="reference" class="short" placeholder="粘贴培训材料或题库。涉及内部规定的题，提供材料更准确。"></textarea></label><p class="hint">点击下方按钮后，题目、参考资料及所选截图会发送到你配置的模型接口。请先检查内容是否适合发送。</p><div class="row"><button id="solve" class="primary">发送并生成答案</button><button id="cancel" disabled>停止</button></div></section>
<p id="status" role="status" aria-live="polite">先设置模型接口，再读取题目。</p><section id="resultBox" hidden><h2>答案与解析</h2><div id="result"></div><button id="copy">复制结果</button></section></main><script type="module" src="panel.js"></script></body></html>
